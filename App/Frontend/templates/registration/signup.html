{% extends "base.html" %}

{% block title %}Sign up – Research Gap Identification{% endblock %}

{% block body %}
  <div class="login-wrap">
    <div class="card login-card">
      <h1>Create account</h1>
      {% if form.errors %}
        <div class="message error">Please correct the errors below.</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create account</button>
      </form>
      <p><a href="{% url 'login' %}">Already have an account? Sign in</a></p>
    </div>
  </div>
{% endblock %}
