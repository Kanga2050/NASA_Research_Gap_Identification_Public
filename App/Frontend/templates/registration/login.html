{% extends "base.html" %}

{% block title %}Sign in – Research Gap Identification{% endblock %}

{% block body %}
  <div class="login-wrap">
    <div class="card login-card">
      <h1>Sign in</h1>
      {% if form.errors %}
        <div class="message error">Invalid username or password.</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign in</button>
      </form>
      <p><a href="{% url 'signup' %}">Need an account? Sign up</a></p>
    </div>
  </div>
{% endblock %}
