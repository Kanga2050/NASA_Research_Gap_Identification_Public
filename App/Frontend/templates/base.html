{% load static %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{% static 'portal/img/nasa-meatball.png' %}" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'portal/css/style.css' %}">
    <title>{% block title %}Research Gap Identification{% endblock %}</title>
  </head>
  <body>
    <header class="topbar">
      <img src="{% static 'portal/img/nasa-meatball.png' %}" alt="NASA insignia">
      <span class="brand-title">Research Gap Identification</span>
      <span class="spacer"></span>
      {% if user.is_authenticated %}
        <span class="topbar-user">{{ user.username }}</span>
        <a class="topbar-link" href="{% url 'logout' %}">Sign out</a>
      {% endif %}
    </header>
    {% block body %}{% endblock %}
  </body>
</html>
