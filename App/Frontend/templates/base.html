{% load static %}{% load cache_bust %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{% static 'portal/img/nasa-meatball.png' %}" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static_versioned 'portal/css/style.css' %}">
    <title>{% block title %}Research Gap Identification{% endblock %}</title>
  </head>
  <body>
    <header class="topbar">
      <span class="brand-title">Research Gap Identification</span>
      <span class="spacer"></span>
      {% if user.is_authenticated %}
        <a class="topbar-user" href="{% url 'account_settings' %}" title="Account settings">{{ user.username }}</a>
        <form class="logout-form" method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="topbar-link">Sign out</button>
        </form>
      {% endif %}
      <img src="{% static 'portal/img/nasa-meatball.png' %}" alt="NASA insignia">
    </header>
    {% if user.is_authenticated %}
      <nav class="tabbar">
        <a href="{% url 'dashboard' %}" class="tab{% if active_tab == 'dashboard' %} active{% endif %}">Dashboard</a>
        <a href="{% url 'studio' %}" class="tab{% if active_tab == 'studio' %} active{% endif %}">Studio</a>
      </nav>
    {% endif %}
    {% block body %}{% endblock %}
  </body>
</html>
